openapi: 3.1.0
info:
  title: Atlas API Contract
  version: 1.0.0
  summary: Master API contract for Atlas platform clients and services.
  description: |
    Production-grade OpenAPI 3.1 contract for Atlas.

    This specification is the single source of truth for:
    - Web frontend
    - Backend implementation
    - Mobile clients
    - Admin portal
    - External integrations

    Design guarantees:
    - RESTful, versioned API under /api/v1
    - Consistent response envelope
    - Standardized errors
    - Standardized pagination/filter/sort/search
    - Typed request and response contracts

    Note: This contract defines interfaces only. It intentionally contains no implementation logic.
  contact:
    name: Atlas API Platform Team
    email: api-platform@atlas.local
  license:
    name: Proprietary
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.atlasbank.com/api/v1
    description: Production
  - url: https://staging-api.atlasbank.com/api/v1
    description: Staging
  - url: http://localhost:3001/api/v1
    description: Local development
tags:
  - name: Authentication
    description: Authentication, sessions, tokens, and identity access flows.
  - name: Profile
    description: Customer profile, preferences, security, and activity.
  - name: Accounts
    description: Bank account lifecycle, balances, and account metadata.
  - name: Transactions
    description: Ledger transactions, search, and categorization.
  - name: Transfers
    description: Internal and external money movement.
  - name: Cards
    description: Card issuance, controls, limits, and card activity.
  - name: Crypto
    description: Custody wallets, deposits, withdrawals, and trading.
  - name: Investments
    description: Brokerage accounts, positions, and order management.
  - name: Loans
    description: Loan applications, repayment, and schedules.
  - name: Notifications
    description: Notifications inbox and delivery preferences.
  - name: Admin
    description: Administrative and compliance management interfaces.
  - name: Demo Mode
    description: Sandbox lifecycle controls for demonstration environments.
  - name: Health
    description: Service health and readiness checks.
  - name: Settings
    description: Platform and customer-facing configuration references.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer account
      description: |
        Creates a new customer account and initial profile shell.

        Validation:
        - Email must be RFC-compliant and unique.
        - Password must satisfy platform password policy.
        - Terms and privacy acceptance timestamps required.

        Permissions: Public
        Rate limit: 10 requests / 15 minutes per IP
      operationId: registerCustomer
      security: []
      x-permissions:
        - public
      x-rateLimit:
        scope: ip
        burst: 10
        window: 15m
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                value:
                  email: ava.simmons@example.com
                  password: StrongPass!234
                  firstName: Ava
                  lastName: Simmons
                  termsAcceptedAt: '2026-07-09T13:05:00Z'
                  privacyAcceptedAt: '2026-07-09T13:05:00Z'
      responses:
        '201':
          description: Customer account created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSession'
              examples:
                created:
                  value:
                    success: true
                    data:
                      accessToken: eyJhbGciOi...
                      refreshToken: eyJhbGciOi...
                      tokenType: Bearer
                      expiresIn: 900
                      sessionId: sess_7a2f31
                    meta:
                      traceId: trc_1001
                      timestamp: '2026-07-09T13:05:04Z'
                    error: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate customer credentials
      description: |
        Authenticates a customer and returns an access/refresh token pair.

        Validation:
        - Email and password required.
        - Optional OTP challenge for MFA-enabled accounts.

        Permissions: Public
        Rate limit: 20 requests / 15 minutes per IP
      operationId: loginCustomer
      security: []
      x-permissions: [public]
      x-rateLimit:
        scope: ip
        burst: 20
        window: 15m
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: jordan.parker@atlasbank.com
                  password: StrongPass!234
                  otpCode: '123456'
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: |
        Issues a new short-lived access token using a refresh token.

        Validation:
        - Refresh token must be active and not revoked.

        Permissions: Public with refresh token
        Rate limit: 60 requests / hour per session
      operationId: refreshAuthToken
      security:
        - refreshTokenCookie: []
      x-permissions:
        - refresh_token
      x-rateLimit:
        scope: session
        burst: 60
        window: 1h
      requestBody:
        required: false
      responses:
        '200':
          description: Access token refreshed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenRefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: End active session
      description: |
        Revokes the current session and invalidates tokens.

        Permissions: customer:self
        Rate limit: 120 requests / hour per user
      operationId: logoutCustomer
      x-permissions:
        - customer:self
      x-rateLimit:
        scope: user
        burst: 120
        window: 1h
      responses:
        '200':
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
              examples:
                ok:
                  value:
                    success: true
                    data:
                      message: Session revoked.
                    meta:
                      traceId: trc_1002
                      timestamp: '2026-07-09T13:08:00Z'
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password/forgot:
    post:
      tags: [Authentication]
      summary: Start password reset
      description: |
        Initiates a password reset flow and sends reset instructions.

        Permissions: Public
        Rate limit: 5 requests / hour per email
      operationId: initiatePasswordReset
      security: []
      x-permissions: [public]
      x-rateLimit:
        scope: subject
        burst: 5
        window: 1h
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Reset request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password/reset:
    post:
      tags: [Authentication]
      summary: Complete password reset
      description: |
        Resets account password using a reset token.

        Validation:
        - Reset token validity and expiration.
        - New password policy validation.

        Permissions: Public with valid reset token
        Rate limit: 10 requests / hour per token
      operationId: completePasswordReset
      security: []
      x-permissions: [public]
      x-rateLimit:
        scope: token
        burst: 10
        window: 1h
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sessions:
    get:
      tags: [Authentication]
      summary: List active sessions
      description: |
        Returns sessions for the authenticated customer.

        Supports filtering by status and ordering by last activity.

        Permissions: customer:self
        Rate limit: 300 requests / hour per user
      operationId: listSessions
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 300
        window: 1h
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Session list returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
                      meta:
                        $ref: '#/components/schemas/OffsetMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sessions/{sessionId}:
    delete:
      tags: [Authentication]
      summary: Revoke a specific session
      description: |
        Revokes a single session by identifier.

        Permissions: customer:self
        Rate limit: 120 requests / hour per user
      operationId: revokeSession
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 120
        window: 1h
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/oauth/providers:
    get:
      tags: [Authentication]
      summary: List OAuth providers
      description: |
        Returns configured OAuth providers for future external identity support.

        Permissions: Public
        Rate limit: 300 requests / hour per IP
      operationId: listOauthProviders
      security: []
      x-permissions: [public]
      x-rateLimit:
        scope: ip
        burst: 300
        window: 1h
      responses:
        '200':
          description: OAuth providers returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OAuthProvider'

  /profile:
    get:
      tags: [Profile]
      summary: Get customer profile
      description: |
        Returns personal, contact, compliance, and identity profile.

        Permissions: customer:self
        Rate limit: 600 requests / hour per user
      operationId: getProfile
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 600
        window: 1h
      responses:
        '200':
          description: Profile returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      summary: Update customer profile
      description: |
        Updates editable customer profile fields.

        Validation:
        - Email format, phone format, postal fields, and tax metadata constraints.
        - Immutable fields rejected with validation error.

        Permissions: customer:self
        Rate limit: 120 requests / hour per user
      operationId: updateProfile
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 120
        window: 1h
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /profile/preferences:
    get:
      tags: [Profile]
      summary: Get profile preferences
      description: |
        Returns theme, language, timezone, accessibility, and notification preferences.

        Permissions: customer:self
        Rate limit: 600 requests / hour per user
      operationId: getProfilePreferences
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 600
        window: 1h
      responses:
        '200':
          description: Preferences returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProfilePreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      summary: Update profile preferences
      description: |
        Updates customer preferences.

        Validation:
        - Enumerated values for language/theme.
        - Currency and timezone must be supported values.

        Permissions: customer:self
        Rate limit: 120 requests / hour per user
      operationId: patchProfilePreferences
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 120
        window: 1h
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePreferencesPatchRequest'
      responses:
        '200':
          description: Preferences updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProfilePreferences'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/security:
    get:
      tags: [Profile]
      summary: Get profile security settings
      description: |
        Returns security controls, trusted devices, and active sessions.

        Permissions: customer:self
        Rate limit: 300 requests / hour per user
      operationId: getProfileSecurity
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 300
        window: 1h
      responses:
        '200':
          description: Security profile returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProfileSecurity'
    patch:
      tags: [Profile]
      summary: Update profile security settings
      description: |
        Updates profile security controls such as MFA and session settings.

        Permissions: customer:self
        Rate limit: 60 requests / hour per user
      operationId: patchProfileSecurity
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 60
        window: 1h
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileSecurityPatchRequest'
      responses:
        '200':
          description: Security settings updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProfileSecurity'
        '400':
          $ref: '#/components/responses/ValidationError'

  /profile/activity:
    get:
      tags: [Profile]
      summary: List profile activity
      description: |
        Returns profile-related activity feed.

        Supports standardized filtering, sorting, search, and pagination.

        Permissions: customer:self
        Rate limit: 600 requests / hour per user
      operationId: listProfileActivity
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 600
        window: 1h
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Activity items returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ActivityItem'
                      meta:
                        $ref: '#/components/schemas/CursorMeta'

  /accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      description: |
        Returns customer accounts.

        Supports filtering by status/type and standardized sort/search/pagination.

        Permissions: customer:self
        Rate limit: 1000 requests / hour per user
      operationId: listAccounts
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 1000
        window: 1h
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/AccountStatus'
        - $ref: '#/components/parameters/AccountType'
      responses:
        '200':
          description: Accounts returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Account'
                      meta:
                        $ref: '#/components/schemas/CursorMeta'
    post:
      tags: [Accounts]
      summary: Create account
      description: |
        Creates a new account product for the customer.

        Permissions: customer:self
        Rate limit: 20 requests / day per user
      operationId: createAccount
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 20
        window: 24h
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /accounts/{accountId}:
    get:
      tags: [Accounts]
      summary: Get account details
      description: |
        Returns a single account by identifier.

        Permissions: customer:self
        Rate limit: 1200 requests / hour per user
      operationId: getAccountById
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 1200
        window: 1h
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Accounts]
      summary: Update account settings
      description: |
        Updates mutable account preferences and nicknames.

        Permissions: customer:self
        Rate limit: 60 requests / hour per user
      operationId: patchAccountById
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 60
        window: 1h
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatchRequest'
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Account'

  /accounts/{accountId}/balances:
    get:
      tags: [Accounts]
      summary: Get account balances
      description: |
        Returns available/current/ledger balances for an account.

        Permissions: customer:self
        Rate limit: 1800 requests / hour per user
      operationId: getAccountBalances
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 1800
        window: 1h
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Balances returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountBalance'

  /accounts/{accountId}/statements:
    get:
      tags: [Accounts]
      summary: List account statements
      description: |
        Returns account statement history.

        Supports pagination, sorting, and date filtering.

        Permissions: customer:self
        Rate limit: 300 requests / hour per user
      operationId: listAccountStatements
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 300
        window: 1h
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Statements returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Statement'
                      meta:
                        $ref: '#/components/schemas/OffsetMeta'

  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      description: |
        Returns transactions across customer accounts.

        Supports standardized cursor and offset pagination, filter, sort, and full-text search.

        Permissions: customer:self
        Rate limit: 1200 requests / hour per user
      operationId: listTransactions
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 1200
        window: 1h
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/TransactionStatus'
        - $ref: '#/components/parameters/TransactionType'
      responses:
        '200':
          description: Transactions returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'
                      meta:
                        $ref: '#/components/schemas/ListMeta'

  /transactions/{transactionId}:
    get:
      tags: [Transactions]
      summary: Get transaction by id
      description: |
        Returns transaction details.

        Permissions: customer:self
        Rate limit: 2400 requests / hour per user
      operationId: getTransactionById
      x-permissions: [customer:self]
      x-rateLimit:
        scope: user
        burst: 2400
        window: 1h
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'

  /transfers:
    get:
      tags: [Transfers]
