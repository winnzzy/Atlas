components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token for authenticated customer/admin APIs.
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh token cookie used for token refresh endpoint.
    sessionCookie:
      type: apiKey
      in: cookie
      name: atlas_session
      description: Session cookie for session-based flows.
    oauth2:
      type: oauth2
      description: Future OAuth 2.1 support for external integrations.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.atlasbank.com/oauth2/authorize
          tokenUrl: https://auth.atlasbank.com/oauth2/token
          scopes:
            atlas.read: Read access to Atlas resources.
            atlas.write: Write access to Atlas resources.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Cursor token for forward pagination.
      schema:
        type: string
    Offset:
      name: offset
      in: query
      description: Offset for offset pagination.
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      description: Maximum items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    Sort:
      name: sort
      in: query
      description: Field name used for sorting.
      schema:
        type: string
    Order:
      name: order
      in: query
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    Search:
      name: search
      in: query
      description: Full-text search term.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    FromDate:
      name: fromDate
      in: query
      description: Inclusive start datetime (ISO-8601).
      schema:
        type: string
        format: date-time
    ToDate:
      name: toDate
      in: query
      description: Inclusive end datetime (ISO-8601).
      schema:
        type: string
        format: date-time
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LoanId:
      name: loanId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [ACTIVE, FROZEN, DORMANT, CLOSED, PENDING]
    AccountType:
      name: type
      in: query
      schema:
        type: string
        enum: [CHECKING, SAVINGS]
    TransactionStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED, REVERSED, ON_HOLD]
    TransactionType:
      name: type
      in: query
      schema:
        type: string
    TransferStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [DRAFT, PENDING_REVIEW, PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED, RETURNED]
    CardStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [ACTIVE, INACTIVE, FROZEN, CLOSED, PENDING_ACTIVATION, LOST, STOLEN]
    CardType:
      name: type
      in: query
      schema:
        type: string
        enum: [VIRTUAL, PHYSICAL]

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              value:
                success: false
                data: null
                meta:
                  traceId: trc_4001
                  timestamp: '2026-07-09T13:22:00Z'
                error:
                  type: validation_error
                  code: VAL_001
                  message: One or more fields failed validation.
                  details:
                    - field: email
                      reason: Invalid email format.
    Unauthorized:
      description: Authentication failed or missing credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but lacking required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Resource conflict or incompatible state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Locked:
      description: Account temporarily locked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BusinessRuleViolation:
      description: Request violates business rule constraints.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Service dependency unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ApiEnvelope:
      type: object
      required: [success, data, meta, error]
      properties:
        success:
          type: boolean
        data:
          nullable: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ErrorObject'
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            success:
              const: false
            data:
              type: 'null'
            error:
              $ref: '#/components/schemas/ErrorObject'
    ResponseMeta:
      type: object
      required: [traceId, timestamp]
      properties:
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        rateLimit:
          $ref: '#/components/schemas/RateLimitMeta'
    PaginationMeta:
      type: object
      properties:
        mode:
          type: string
          enum: [cursor, offset]
        cursor:
          type: object
          properties:
            next:
              type: string
            previous:
              type: string
            hasMore:
              type: boolean
        offset:
          type: object
          properties:
            total:
              type: integer
            offset:
              type: integer
            limit:
              type: integer
    RateLimitMeta:
      type: object
      properties:
        limit:
          type: integer
        remaining:
          type: integer
        resetAt:
          type: string
          format: date-time
    ErrorObject:
      type: object
      required: [type, code, message]
      properties:
        type:
          type: string
          enum:
            - validation_error
            - authentication_error
            - authorization_error
            - business_rule_error
            - rate_limit_error
            - server_error
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
        traceId:
          type: string

    OffsetMeta:
      allOf:
        - $ref: '#/components/schemas/ResponseMeta'
        - type: object
          properties:
            pagination:
              type: object
              properties:
                mode:
                  const: offset
                offset:
                  type: object
                  required: [total, offset, limit]
                  properties:
                    total:
                      type: integer
                    offset:
                      type: integer
                    limit:
                      type: integer
    CursorMeta:
      allOf:
        - $ref: '#/components/schemas/ResponseMeta'
        - type: object
          properties:
            pagination:
              type: object
              properties:
                mode:
                  const: cursor
                cursor:
                  type: object
                  required: [hasMore]
                  properties:
                    next:
                      type: string
                    previous:
                      type: string
                    hasMore:
                      type: boolean
    ListMeta:
      oneOf:
        - $ref: '#/components/schemas/CursorMeta'
        - $ref: '#/components/schemas/OffsetMeta'

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName, termsAcceptedAt, privacyAcceptedAt]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        termsAcceptedAt:
          type: string
          format: date-time
        privacyAcceptedAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        otpCode:
          type: string
          pattern: '^[0-9]{6}$'
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
    AuthSession:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, sessionId]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
        sessionId:
          type: string
    TokenRefreshResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
    Session:
      type: object
      required: [id, device, ipAddress, createdAt, expiresAt, isCurrent]
      properties:
        id:
          type: string
          format: uuid
        device:
          type: string
        ipAddress:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean

    Profile:
      type: object
      required: [id, firstName, lastName, email, verificationStatus]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
        address:
          $ref: '#/components/schemas/Address'
        employment:
          $ref: '#/components/schemas/Employment'
        taxInfo:
          $ref: '#/components/schemas/TaxInfo'
        verificationStatus:
          type: string
          enum: [verified, pending, under_review]
    ProfilePatchRequest:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          minLength: 7
          maxLength: 20
        address:
          $ref: '#/components/schemas/Address'
        employment:
          $ref: '#/components/schemas/Employment'
        taxInfo:
          $ref: '#/components/schemas/TaxInfo'
    ProfilePreferences:
      type: object
      required: [language, currency, timezone, theme]
      properties:
        language:
          type: string
          enum: [en, es]
        currency:
          type: string
          minLength: 3
          maxLength: 3
        timezone:
          type: string
        theme:
          type: string
          enum: [light, dark, system]
        accessibility:
          type: object
          properties:
            reducedMotion:
              type: boolean
            highContrast:
              type: boolean
            largeText:
              type: boolean
            screenReaderOptimized:
              type: boolean
        notificationPreferences:
          $ref: '#/components/schemas/NotificationPreferences'
    ProfilePreferencesPatchRequest:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          enum: [en, es]
        currency:
          type: string
          minLength: 3
          maxLength: 3
        timezone:
          type: string
        theme:
          type: string
          enum: [light, dark, system]
        accessibility:
          type: object
        notificationPreferences:
          type: object
    ProfileSecurity:
      type: object
      required: [mfaEnabled, loginAlertsEnabled, connectedDevices, activeSessions]
      properties:
        mfaEnabled:
          type: boolean
        mfaMethod:
          type: string
        loginAlertsEnabled:
          type: boolean
        biometricUnlockEnabled:
          type: boolean
        sessionTimeoutMinutes:
          type: integer
        connectedDevices:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedDevice'
        activeSessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    ProfileSecurityPatchRequest:
      type: object
      additionalProperties: false
      properties:
        mfaEnabled:
          type: boolean
        mfaMethod:
          type: string
        loginAlertsEnabled:
          type: boolean
        biometricUnlockEnabled:
          type: boolean
        sessionTimeoutMinutes:
          type: integer
          minimum: 5
          maximum: 240
    ActivityItem:
      type: object
      required: [id, type, title, description, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        description:
          type: string
        occurredAt:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2
    Employment:
      type: object
      properties:
        employerName:
          type: string
        jobTitle:
          type: string
        status:
          type: string
